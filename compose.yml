services:
  r2flow:
    container_name: r2flow
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    tty: true
    stdin_open: true
    network_mode: "host"
    ports:
      - "6006:6006"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - KITTI360_ROOT=${KITTI360_ROOT:-/tmp/dummy_dataset}
      - GO2W_SIM_ROOT=${GO2W_SIM_ROOT:-/tmp/dummy_dataset}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/home/docker/workspace
      - ${KITTI360_ROOT:-/tmp/dummy_dataset}:/home/docker/workspace/r2flow/data/kitti_360/dataset
      # The repo is bind-mounted above, so r2flow/data/go2w_sim/dataset being a
      # host symlink would dangle in here. Mount the scans over that path instead.
      - ${GO2W_SIM_ROOT:-/tmp/dummy_dataset}:/home/docker/workspace/r2flow/data/go2w_sim/dataset
      # Mount the whole data root at the same path it has on the host, so any
      # r2flow/data/*/dataset symlink pointing into it resolves in here too.
      # Read-only: the converters run on the host, the container only reads.
      - ${LIDAR_DATA_ROOT:-/tmp/dummy_dataset}:${LIDAR_DATA_ROOT:-/tmp/dummy_dataset}:ro
    shm_size: 16g
    entrypoint: ["bash"]
